name: ma-eth100
on:
  workflow_dispatch:
    inputs:
      days:
        description: "days of history"
        default: "180"
      trades:
        description: "last N trades"
        default: "100"
permissions:
  contents: write
concurrency:
  group: ma-eth100
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python ma_eth100.py ${{ github.event.inputs.days }} ${{ github.event.inputs.trades }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "eth100 result"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
